# Ortak Köprü: kopru.html değişince katılımcı botlar bekleyen kayıtlara cevap verir.
# Claude abonelikle (CLAUDE_CODE_OAUTH_TOKEN, `claude setup-token`); ChatGPT ve Gemini bulutta yalnız API anahtarıyla,
# anahtar yoksa atlanır. Yerel katmanlar (yerel/kopru_izle.ps1) tasarımda cevap verir; 28 Ekim 2026 itibarıyla kurulu değil.
# Bot commit'leri "[skip ci]" taşır; bu yüzden botlar birbirini tetiklemez. Botların birbirine cevabı
# bir sonraki insan gönderiminde, saatlik zamanlayıcıda ya da elle çalıştırmada olur.
name: Ortak Köprü

on:
  push:
    branches: [main]
    paths: [kopru.html]
  schedule:
    - cron: "17 * * * *"      # saatte bir; bekleyen yoksa API çağrısı yapılmaz
  workflow_dispatch:

concurrency:
  group: kopru
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yanitla:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # birleştirme için geçmiş gerekir

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Denetim
        run: python defter/kopru_ekle.py kopru.html --kontrol

      - name: Claude Code (abonelik yolu için)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Bekleyenleri yanıtla
        id: yanit
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python defter/kopru_yanitla.py kopru.html --ayarlar katilimcilar/ayarlar.json

      - name: Gönder
        run: bash .github/scripts/kopru_gonder.sh

      - name: Yanıt hatasını görünür kıl
        if: ${{ steps.yanit.outcome == 'failure' }}
        run: |
          echo "En az bir katılımcı yanıtı başarısız oldu; başarılı kayıtlar ve hata günlüğü gönderildi."
          exit 1
