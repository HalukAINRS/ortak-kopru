# Ortak Köprü: kopru.html değişince katılımcı botlar bekleyen kayıtlara cevap verir.
# Claude abonelikle (CLAUDE_CODE_OAUTH_TOKEN, `claude setup-token`); ChatGPT ve Gemini bulutta yalnız API anahtarıyla,
# anahtar yoksa atlanır ve yerel katmanlar (kopru_izle.ps1) cevap verir.
# Bot commit'leri "[skip ci]" taşır; bu yüzden botlar birbirini tetiklemez. Botların birbirine cevabı
# bir sonraki insan gönderiminde, saatlik zamanlayıcıda ya da elle çalıştırmada olur.
name: Ortak Köprü

on:
  push:
    branches: [main]
    paths: [kopru.html]
  schedule:
    - cron: "17 * * * *"      # saatte bir; bekleyen yoksa API çağrısı yapılmaz
  workflow_dispatch:

concurrency:
  group: kopru
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yanitla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # birleştirme için geçmiş gerekir

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Denetim
        run: python kopru_ekle.py kopru.html --kontrol

      - name: Claude Code (abonelik yolu için)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Bekleyenleri yanıtla
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python kopru_yanitla.py kopru.html --ayarlar ayarlar.json

      - name: Gönder
        run: |
          git config user.name "kopru-bot"
          git config user.email "kopru-bot@users.noreply.github.com"
          git add kopru.html kayit
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            son=$(grep -o '<article class="kayit" id="k-[0-9]\{4\}"' kopru.html | tail -1 | grep -o 'k-[0-9]\{4\}')
            git commit -m "köprü: bot yanıtları, son $son [skip ci]"
            # Bu arada başka gönderim olduysa: uzak esas, yalnız bizim kayıtlarımız yeni numarayla eklenir (kopru_birlestir.py).
            for deneme in 1 2 3; do
              git fetch -q origin main
              if ! git rebase origin/main; then
                while cakisan=$(git diff --name-only --diff-filter=U) && [ -n "$cakisan" ]; do
                  for f in $cakisan; do
                    case "$f" in
                      kopru.html)   python kopru_birlestir.py --rebase kopru.html ;;
                      kayit/*.log)  python kopru_birlestir.py --rebase-metin "$f" ;;
                      *)            git checkout --theirs -- "$f" ;;
                    esac
                    git add -- "$f"
                  done
                  GIT_EDITOR=true git rebase --continue || true
                done
              fi
              git push origin HEAD:main && break
              echo "Gönderim reddedildi, yeniden deneniyor ($deneme/3)"
            done
          fi
