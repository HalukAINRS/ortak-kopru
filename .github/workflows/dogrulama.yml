name: Depo doğrulama

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogrulama-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cevrimdisi:
    name: Çevrimdışı kontroller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Yerelde çalıştırılan `python tools/dogrula.py` ile aynı liste: testler, depo kontrolü,
      # okuma sayfaları, JSON sözleşmeleri, JavaScript/Bash/PowerShell sözdizimi.
      # Bir araç bulunmuyorsa o kontrol ATLANDI yazılır; atlama başarısızlık sayılmaz.
      - name: Birleşik çevrimdışı doğrulama
        run: python tools/dogrula.py
