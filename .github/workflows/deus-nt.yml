name: deus_ex_machina NT derleme

on:
  pull_request:
    paths:
      - 'windows/nt/**'
      - 'src/ortak_kopru/adapters/**'
      - 'tests/test_deus_nt.py'
      - '.github/workflows/deus-nt.yml'
  push:
    branches: [main]
    paths:
      - 'windows/nt/**'
      - 'src/ortak_kopru/adapters/**'
      - 'tests/test_deus_nt.py'
      - '.github/workflows/deus-nt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deus-nt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: KMDF x64 derleme (yükleme yok)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WDK ile derle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $builder = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $builder) { throw 'MSBuild bulunamadı.' }
          & ./windows/nt/build.ps1 -Restore -MSBuild $builder
          $output = Join-Path $PWD 'windows/nt/build/x64/Release'
          $binary = Join-Path $output 'deus_kernel.sys'
          @{
            source_commit = $env:GITHUB_SHA
            binary = 'deus_kernel.sys'
            sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            compiled = $true
            signed = $false
            installed = $false
            loaded = $false
            target_machine_tested = $false
            architecture = 'x64'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'build-receipt.json') -Encoding utf8
      - name: İmzasız derleme çıktısı
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deus-kernel-x64-unsigned
          path: |
            windows/nt/build/x64/Release/deus_kernel.sys
            windows/nt/build/x64/Release/deus_kernel.pdb
            windows/nt/build/x64/Release/build-receipt.json
          if-no-files-found: error
          retention-days: 14
